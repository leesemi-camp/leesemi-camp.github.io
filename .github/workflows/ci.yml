name: CI

on:
  push:
    # branches: ["main"]
    branches-ignore:
      - "gh-pages"
      - "docs/**"
    paths-ignore:
      - "data/hotspots.public.json"
  pull_request:

permissions:
  contents: read

jobs:
  hotspot-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: "Export Firestore hotspots to temp file"
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: node scripts/export-hotspots-public-json.mjs --out /tmp/hotspots.public.json

      - name: "Validate public hotspot snapshot"
        run: node scripts/validate-hotspots-public-json.mjs /tmp/hotspots.public.json

  test:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: 'npm'
      - name: "Install lcov"
        run: |
          sudo apt-get install -y -q lcov
          lcov --version

      - name: "Install Dependencies, Playwright Browsers"
        run: |
          npm install
          npx playwright install --with-deps chromium chrome msedge webkit

      - name: "Run Playwright Tests"
        run: |
          # runs coverage collecting project "Chromium-Coverage" together
          npm run test
          # fixup: coverage/lcov.info contains "localhost-5173\". Remove this part for correct file mapping.
          sed -i 's/localhost-5173//g' coverage/lcov.info

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: "coverage-pr-${{ github.event.number }}"
          path: coverage
          retention-days: 3

      - uses: kefasjw/lcov-pull-request-report@v1
        continue-on-error: true # todo: check GitHub token permissions
        with:
          lcov-file: coverage/lcov.info
          github-token: ${{ github.token }}
